<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교수 소개</title>
  <style>
    /* 기본 스타일 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: linear-gradient(160deg, #e8f4fc 0%, #f5f0ff 50%, #fff8f0 100%);
      min-height: 100vh;
      color: #2c3e50;
      line-height: 1.6;
    }

    /* 페이지 전체 레이아웃 */
    .page {
      max-width: 520px;
      margin: 0 auto;
      padding: 48px 24px 64px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 상단 제목 */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a365d;
      letter-spacing: -0.02em;
    }

    .header p {
      margin-top: 8px;
      font-size: 0.95rem;
      color: #5a6c7d;
    }

    /* 가운데 교수 소개 카드 */
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(26, 54, 93, 0.1);
      padding: 32px 28px;
      width: 100%;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4a90d9, #6b5b95);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #fff;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1.35rem;
      color: #1a365d;
      margin-bottom: 4px;
    }

    .card .title {
      font-size: 0.9rem;
      color: #4a90d9;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .card .bio {
      font-size: 0.95rem;
      color: #5a6c7d;
      text-align: left;
      width: 100%;
    }

    .card .bio li {
      margin-bottom: 8px;
      list-style: none;
      padding-left: 1.2em;
      position: relative;
    }

    .card .bio li::before {
      content: "•";
      color: #4a90d9;
      position: absolute;
      left: 0;
    }

  </style>
</head>
<body>
  <div class="page">
    <!-- 상단: 제목 -->
    <header class="header">
      <h1>교수 소개</h1>
      <p>영어학부</p>
    </header>

    <!-- 가운데: 교수 소개 카드 -->
    <main class="card">
      <div class="card-photo" aria-hidden="true">👨‍🏫</div>
      <h2>홍길동</h2>
      <p class="title">영어학부 교수</p>
      <ul class="bio">
        <li>인공지능·머신러닝 연구</li>
        <li>데이터 과학 및 소프트웨어 공학 강의</li>
        <li>학생 지도 및 산학 협력 담당</li>
      </ul>
    </main>
  </div>
</body>
</html>
